name: Configure LeadBox Worker secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-worker-secrets:
    name: Upload Telegram secrets to Cloudflare Worker
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
    steps:
      - name: Check configuration (no values printed)
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN WEBHOOK_SECRET ADMIN_CHAT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $key"
              exit 1
            fi
          done
          if ! [[ "$ADMIN_CHAT_ID" =~ ^-?[0-9]+$ ]]; then
            echo "::error::ADMIN_CHAT_ID must be numeric"
            exit 1
          fi
          if ! [[ "$WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{16,256}$ ]]; then
            echo "::error::WEBHOOK_SECRET must be 16-256 characters (A-Z, a-z, 0-9, _ or -)"
            exit 1
          fi

      - name: Set all Worker secrets (not build secrets)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import os,json,sys; json.dump({k:os.environ[k] for k in ("BOT_TOKEN","WEBHOOK_SECRET","ADMIN_CHAT_ID")},sys.stdout)' \
            | npx --yes wrangler@4 secret bulk --name leadbox-studio-v1

      - name: Report completion
        run: echo "Worker runtime secrets uploaded. Verify Telegram webhook separately."
